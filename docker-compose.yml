services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shortener_user
      POSTGRES_PASSWORD: shortener_pass
      POSTGRES_DB: shortener_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener_user -d shortener_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  shortener-service:
    build: ./shortener-service
    environment:
      DATABASE_URL: postgresql://shortener_user:shortener_pass@postgres:5432/shortener_db
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 2

  rate-limiter-service:
    build: ./rate-limiter-service
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SHORTENER_URL: http://shortener-service:8000
      RATE_LIMIT_MAX_TOKENS: 10
      RATE_LIMIT_REFILL_RATE: 1
      FAIL_OPEN: "true"
    depends_on:
      redis:
        condition: service_healthy
      shortener-service:
        condition: service_started
    deploy:
      replicas: 3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - rate-limiter-service

volumes:
  pgdata: